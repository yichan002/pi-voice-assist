name: build-apk

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0' > /dev/null

      - name: Compile
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          JAR=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p build/classes build/dex
          javac -source 11 -target 11 -classpath "$JAR" -d build/classes $(find src -name '*.java') 2>&1 | grep -v 'bootstrap class path' || true
          $BT/d8 --lib "$JAR" --min-api 26 --output build/dex $(find build/classes -name '*.class')

      - name: Package and sign
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          JAR=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml -R build/res.zip --auto-add-overlay \
            --java build/gen --min-sdk-version 26 --target-sdk-version 34 --version-code 1 --version-name 0.1
          cd build/dex && zip -q -j ../base.apk classes.dex && cd ../..
          keytool -genkeypair -keystore build/debug.keystore -alias piassist -storepass piassist -keypass piassist \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pi Assist,O=Pi,C=CN"
          $BT/zipalign -f -p 4 build/base.apk build/aligned.apk
          $BT/apksigner sign --ks build/debug.keystore --ks-pass pass:piassist --key-pass pass:piassist \
            --out build/pi-assist.apk build/aligned.apk
          $BT/apksigner verify --print-certs build/pi-assist.apk | head -3
          ls -l build/pi-assist.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pi-assist-apk
          path: build/pi-assist.apk
